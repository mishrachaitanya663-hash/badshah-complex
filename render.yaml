databases:
  - name: badshah-db
    plan: free
    databaseName: badshah_complex

services:
  - type: web
    name: badshah-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: badshah-db
          property: connectionString
      - key: PGSSLMODE
        value: require
      - key: CORS_ORIGINS
        value: https://badshah-customer.onrender.com,https://badshah-admin.onrender.com
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_TTL_HOURS
        value: 8
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_IMAGE_MB
        value: 5
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: badshah-customer
    runtime: static
    plan: free
    rootDir: customer
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        value: https://badshah-api.onrender.com
      - key: VITE_ADMIN_URL
        value: https://badshah-admin.onrender.com/admin/

  - type: web
    name: badshah-admin
    runtime: static
    plan: free
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        value: https://badshah-api.onrender.com
